<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - My Project</title>
    <style>
        /* CSS Section */
        .login-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f7f6;
            font-family: 'Segoe UI', sans-serif;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 { font-size: 28px; margin-bottom: 25px; color: #333; }

        .input-group { margin-bottom: 20px; position: relative; }

        .custom-input {
            width: 100%;
            padding: 15px;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            outline: none;
        }

        .password-wrapper { display: flex; align-items: center; position: relative; }

        .eye-icon {
            position: absolute;
            right: 15px;
            cursor: pointer;
            font-size: 18px;
            user-select: none;
        }

        .primary-btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary-btn:hover { background-color: #0056b3; }

        .forgot-link { margin-top: 20px; }
        .forgot-link a { text-decoration: none; color: #007bff; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <h2>Create Account</h2>
        
        <form id="signupForm">
            <div class="input-group">
                <input type="text" id="regUsername" placeholder="Username" class="custom-input" required>
            </div>

            <div class="input-group">
                <input type="email" id="regEmail" placeholder="Email Address" class="custom-input" required>
            </div>

            <div class="input-group password-wrapper">
                <input type="password" id="regPassword" placeholder="Password" class="custom-input" required>
                <span class="eye-icon" onclick="togglePass('regPassword')">🔒</span>
            </div>

            <div class="input-group password-wrapper">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" class="custom-input" required>
                <span class="eye-icon" onclick="togglePass('confirmPassword')">🔒</span>
            </div>

            <button type="submit" class="primary-btn">Sign Up</button>
        </form>

        <div class="forgot-link">
            <p>Already have an account? <a href="/login">Login here</a></p>
        </div>
    </div>
</div>
<script>
// CSRF token मिळवा
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

document.getElementById('signupForm').addEventListener('submit', async function(e) {
    e.preventDefault(); 
    
    const username = document.getElementById('regUsername').value;
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    const confirmPass = document.getElementById('confirmPassword').value;

    if (password !== confirmPass) {
        alert("Passwords do not match!");
        return;
    }

    try {
        const response = await fetch('/api/signup/', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')  // ← CSRF token घातला
            },
            body: JSON.stringify({ 
                username: username,
                email: email, 
                password: password
            })
        });

        const data = await response.json();

        if (data.status === "success") {
            alert("✅ Account created successfully! Please login.");
            window.location.href = "/login/";
        } else {
            alert("❌ Error: " + data.message);
        }
    } catch (error) {
        console.error('Error:', error);
        alert("Server error! Please check if Django server is running.");
    }
});
</script>
</body>
</html>
